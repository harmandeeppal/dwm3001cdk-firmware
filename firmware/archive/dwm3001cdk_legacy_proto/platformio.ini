; Human-motion wearable-node firmware.
; Device identity, target J-Link serial, temporary role, and UWB settings are
; loaded by extra_script.py from hardware/config/*.json.  There is deliberately
; no default device or COM port in this file: a build must explicitly select an
; enabled JSON profile and a device via DWM_PROFILE_ID and DWM_DEVICE_ID.

[env]
platform = nordicnrf52
board = nrf52833_dk
framework = zephyr
build_flags =
    -DDTC_OVERLAY_FILE=nrf52833_dk.overlay
board_build.zephyr.cmake_extra_args = -DDTC_OVERLAY_FILE=nrf52833_dk.overlay
extra_scripts = pre:extra_script.py
upload_protocol = custom
monitor_speed = 115200
